# Champi STT Voice Assistant Configuration
# ==========================================

# STT Provider Configuration
stt:
  provider: "whisperlive"  # STT provider: whisperlive, openai, deepgram

  # Provider-specific settings (for WhisperLive)
  model_size: "base"  # tiny, base, small, medium, large-v2, large-v3
  device: "cpu"  # cpu, cuda
  language: "en"  # Language code or null for auto-detect

# Wake Word Configuration
wakeword:
  engine: "openwakeword"  # Wake word engine: openwakeword, porcupine, vosk
  keywords:
    - "hey_jarvis"  # OpenWakeWord models: hey_jarvis, alexa, etc.
  sensitivity: 0.5  # 0.0 (least sensitive) to 1.0 (most sensitive)
  access_key: null  # Picovoice access key (only for Porcupine engine)

# Command Configuration
commands:
  file: null  # Path to commands YAML file (optional)
  enable_builtin: true  # Enable built-in commands (time, date, web search, etc.)

# Service Configuration
service:
  continuous_mode: true  # Keep listening after each command
  auto_start: false  # Auto-start service on system boot
  max_recording_duration: 10.0  # Maximum command recording duration (seconds)

  # Logging
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_file: null  # Log file path (null = console only)

  # Directories
  config_dir: "~/.config/champi-stt"
  cache_dir: "~/.cache/champi-stt"

# IPC Configuration (Inter-Process Communication for Wake Indicator UI)
ipc:
  memory_prefix: "champi_assistant"  # Shared memory namespace (for isolation)
  ui_window_x: 50  # UI window X position (pixels from left)
  ui_window_y: 50  # UI window Y position (pixels from top)
  ui_poll_rate_hz: 60  # Signal polling rate (Hz)

  # Note: Can override via environment variables:
  # export CHAMPI_ASSISTANT_MEMORY_PREFIX="champi_assistant"
  # export CHAMPI_ASSISTANT_UI_WINDOW_X="100"
  # export CHAMPI_ASSISTANT_UI_WINDOW_Y="100"
  # export CHAMPI_ASSISTANT_UI_ENABLED="true"

# Usage:
# ------
# champi-stt assistant start --config assistant_config.yaml
