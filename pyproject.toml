[project]
name = "champi-stt"
version = "1.1.2"
description = "Multi-provider speech-to-text library with voice assistant features"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Divagnz", email = "oscar.liguori.bagnis@gmail.com"}
]
license = {text = "MIT"}
keywords = ["stt", "speech-to-text", "whisper", "voice-assistant", "wake-word", "voice-commands"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Audio I/O and processing
    "numpy",
    "sounddevice",
    "scipy",
    "pydub",
    "soundfile",
    "aiofiles",
    "tqdm",
    "librosa>=0.10.0",
    "webrtcvad",
    # STT core
    "faster-whisper",
    "ctranslate2",
    "tokenizers",
    "onnxruntime",
    # Networking and HTTP
    "httpx",
    "aiohttp>=3.8.0",
    "requests>=2.33.0",
    "openai",
    # CLI and UI utilities
    "rich>=14.0.0",
    "typer>=0.16.0",
    "click>=8.0.0",
    "textual>=5.3.0",
    # Configuration
    "pyyaml>=6.0.0",
    "psutil",
    "mutagen",
    # Event system
    "blinker>=1.9.0",
    "awaitlet>=0.0.1",
    "champi-signals @ https://github.com/champi-ai/champi-signals/releases/download/v0.1.0/champi_signals-0.1.0-py3-none-any.whl",
    # Logging
    "loguru",
]

[project.optional-dependencies]
# PyTorch GPU acceleration
torch = [
    "torch",
    "torchaudio",
    "torchvision",
]

# ImGui 3D visualization
imgui = [
    "imgui-bundle",
    "pyglm",
    "PyOpenGL",
    "pygltflib",
]

# NLP features
nlp = [
    "spacy",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "tiktoken",
    "unidecode",
]

# Wake word engines
wakeword = [
    "openwakeword>=0.4.0",
]

# Vosk offline speech recognition / wake word
vosk = [
    "vosk>=0.3.45",
]

# AssemblyAI real-time streaming STT
assemblyai = [
    "httpx>=0.25.0",
    "websockets>=12.0",
]

# Web configuration UI
webui = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

# MCP server (Model Context Protocol)
mcp = [
    "mcp[cli]>=1.0,<2.0",
]

# Speaker diarization via pyannote.audio
diarization = [
    "pyannote.audio>=3.1.0",
    "soundfile>=0.12.0",
]

# All optional extras
all = [
    "champi-stt[torch,imgui,nlp,wakeword,vosk,assemblyai,diarization,webui,mcp]",
]

# Documentation
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]

# Development tools
dev = [
    "build",
    "twine",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "bandit[toml]>=1.7.0",
    "detect-secrets>=1.4.0",
]

# Test tools
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "coverage",
]


[project.urls]
Homepage = "https://github.com/divagnz/champi-stt"
Repository = "https://github.com/divagnz/champi-stt"
Issues = "https://github.com/divagnz/champi-stt/issues"

[project.scripts]
champi-stt = "champi_stt.cli:cli"
champi-stt-mcp = "champi_stt.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/champi_stt"]

[tool.hatch.metadata]
allow-direct-references = true

# UV configuration (from champi)
[tool.uv]
package = true
no-build-isolation = false
managed = true

[tool.uv.sources]
champi-signals = { url = "https://github.com/champi-ai/champi-signals/releases/download/v0.1.0/champi_signals-0.1.0-py3-none-any.whl" }
torch = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

# Linting and formatting
[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hatch
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
# Ruff configuration for linting and formatting
target-version = "py312"
line-length = 88
indent-width = 4

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
    "N",    # pep8-naming
    "C90",  # mccabe
    "RUF",  # Ruff-specific rules
]

ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = [
    # at least this three should be fine in tests:
    "S101", # asserts allowed in tests...
    "ARG",  # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT",  # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    # The below are debateable
    "PLR2004", # Magic value used in comparison, ...
    "S311", # Standard pseudo-random generators are not suitable for cryptographic purposes
]

[tool.ruff.lint.isort]
known-first-party = ["champi_stt"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "sounddevice.*",
    "webrtcvad.*",
    "vosk.*",
    "librosa.*",
    "resemblyzer.*",
    "scipy.*",
    "psutil.*",
    "yaml.*",
    "imgui_bundle.*",
    "OpenGL.*",
    "glfw.*",
    "champi_signals.*",
    "mcp.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "champi_stt.core.*",
    "champi_stt.assistant.commands.*",
]
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "champi_stt.core.audio"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "champi_stt.assistant.*",
    "champi_stt.diarization.*",
    "champi_stt.providers.*",
    "champi_stt.api.*",
    "champi_stt.core.multi_room",
    "champi_stt.factory",
    "champi_stt.mcp.*",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --cov=src/champi_stt --cov-report=term --cov-report=html --cov-report=xml --cov-fail-under=47"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "visual: marks tests that require visual inspection"
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/examples/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 45

[tool.bandit]
exclude_dirs = ["tests", "examples"]
skips = ["B101", "B601"]

[tool.scripts]
# Security scanning
security = [
  "bandit -r src/champi_stt/ --severity-level medium",
  "./gitleaks detect --source . --verbose"
]
security-full = [
  "bandit -r src/champi_stt/ -f json",
  "./gitleaks detect --source . --verbose"
]

# Development tools
lint = "ruff check src/champi_stt/"
format = "ruff format src/champi_stt/"
test = "pytest tests/"
clean-security = "rm -f gitleaks.tar.gz && rm -f gitleaks"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "mypy>=1.8.0",
    "pre-commit>=3.0.0",
    "commitizen>=3.0.0",
    "detect-secrets>=1.4.0",
    "bandit>=1.8.6",
    "pytest-mock>=3.15.1",
    "genbadge[coverage]>=1.1.0",
]

# PyTorch CUDA support — explicit so general packages (requests, pillow, etc.) resolve from PyPI
[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

# champi-stt distribution settings
[tool.champi-stt]
# GitHub Releases wheel URL — updated automatically on every version bump
release_url = "https://github.com/champi-ai/champi-stt/releases/download/v1.1.2/champi_stt-1.1.2-py3-none-any.whl"

# Commitizen configuration for semantic versioning
[tool.commitizen]
name = "cz_conventional_commits"
version = "1.1.2"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
    "src/champi_stt/__init__.py:__version__",
    "pyproject.toml:release_url",
    "README.md:releases/download"
]
changelog_file = "CHANGELOG.md"
changelog_incremental = true
update_changelog_on_bump = true
