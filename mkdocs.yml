site_name: Champi STT
site_description: Multi-provider speech-to-text library with voice assistant features
site_url: https://champi-ai.github.io/champi-stt/
repo_url: https://github.com/champi-ai/champi-stt
repo_name: champi-ai/champi-stt
edit_uri: edit/main/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
            members_order: source
            show_signature_annotations: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Architecture: architecture.md
  - API Reference:
      - Overview: api/index.md
      - Factory: api/factory.md
      - Base Classes:
          - BaseSTTProvider: api/base_provider.md
          - BaseSTTConfig: api/base_config.md
          - BaseTranscriber: api/base_transcriber.md
      - Streaming: api/streaming.md
      - Multi-Room Audio: api/multi_room.md
      - Diarization: api/diarization.md
      - Response Types: api/response.md
  - Features:
      - IPC System: features/ipc.md
      - ImGui Integration: features/imgui.md
  - Development:
      - Contributing: contributing.md
      - Changelog: changelog.md
      - Security: security.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
