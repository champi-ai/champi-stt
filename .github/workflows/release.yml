name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'pyproject.toml'
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    # Runs on main branch pushes only; skips commits that are themselves version bumps
    if: "github.ref_type == 'branch' && !startsWith(github.event.head_commit.message, 'bump:')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and update changelog
        id: cz
        run: |
          uv run cz bump --yes --changelog --changelog-to-stdout > RELEASE_NOTES.md || echo "NO_BUMP=true" >> $GITHUB_OUTPUT
          echo "VERSION=$(uv run cz version --project)" >> $GITHUB_OUTPUT

      - name: Push changes
        if: steps.cz.outputs.NO_BUMP != 'true'
        run: |
          git push
          git push --tags

      - name: Build package
        if: steps.cz.outputs.NO_BUMP != 'true'
        run: uv build

      - name: Create GitHub Release
        if: steps.cz.outputs.NO_BUMP != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.cz.outputs.VERSION }}
          name: v${{ steps.cz.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          draft: false
          prerelease: false

  publish:
    runs-on: ubuntu-latest
    # Triggered when a v* tag is pushed directly (e.g. manual hotfix tags)
    if: github.ref_type == 'tag'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Build package
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          draft: false
          prerelease: false
